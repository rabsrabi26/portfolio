<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 · Destination host unreachable — Rabiul Islam</title>
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f5f7fa" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#080d17" media="(prefers-color-scheme: dark)">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<script>
try { var t = localStorage.getItem('theme'); if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); } catch (e) {}
</script>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<main class="nf">
  <div class="box">
    <div class="chip" style="margin-bottom:10px"><i class="dot" style="background:#ff6b72;animation:none"></i>HTTP 404 · route not found</div>
    <h1><span class="grad">404</span></h1>
    <p>That page isn't in my routing table. I traced the path for you:</p>

    <div class="term" role="img" aria-label="Terminal output: traceroute to the requested page ends with destination host unreachable">
      <div class="bar"><i></i><i></i><i></i></div>
      <pre id="out" aria-hidden="true"></pre>
    </div>
    <noscript><p>Destination host unreachable. The page you asked for doesn't exist.</p></noscript>

    <div class="cta" style="margin-top:22px">
      <a class="btn primary" href="/">← Back to home</a>
      <a class="btn" href="/#projects">See my projects</a>
      <a class="btn" href="/#lab">Open the Lab</a>
    </div>
  </div>
</main>

<script>
(function () {
  var out = document.getElementById('out');
  var path = location.pathname + location.search;
  if (path.length > 48) path = path.slice(0, 45) + '…';
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  // Documentation-only address ranges (RFC 5737), so these are never real hosts.
  var lines = [
    ['dim', '$ traceroute rabsrabi.com' ],
    ['', ' 1  gateway           (192.0.2.1)       1.1 ms'],
    ['', ' 2  isp-access        (198.51.100.17)   4.8 ms'],
    ['', ' 3  dhaka-core        (198.51.100.2)    7.3 ms'],
    ['', ' 4  bd-ix             (203.0.113.9)    11.9 ms'],
    ['', ' 5  edge-router       (203.0.113.41)   14.2 ms'],
    ['ok', ' 6  rabsrabi.com     reached          16.0 ms'],
    ['dim', ''],
    ['dim', '$ GET ' ],
    ['bad', ' 7  * * *   request timed out'],
    ['bad', ' !H  destination host unreachable: no such page']
  ];
  var i = 0;
  function add(l) {
    var s = document.createElement('span');
    if (l[0]) s.className = l[0];
    s.textContent = l[1];
    if (l[1] === '$ GET ') s.textContent = '$ GET ' + path;
    out.appendChild(s); out.appendChild(document.createTextNode('\n'));
  }
  if (reduce) { lines.forEach(add); return; }
  (function next() { if (i < lines.length) { add(lines[i++]); setTimeout(next, 260); } })();
})();
</script>
</body>
</html>
